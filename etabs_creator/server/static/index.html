<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETABS Creator</title>
<style>
  :root { --bg:#faf9f5; --surface:#fff; --text:#141413; --muted:#6b6a63; --border:#e5e2d6; --accent:#c96442; --accent-text:#fff; --ok:#46592f; --err:#9c2f20; }
  @media (prefers-color-scheme: dark) { :root { --bg:#262624; --surface:#30302e; --text:#faf9f5; --muted:#a8a69c; --border:#46443f; --accent:#d97757; --ok:#a5c283; --err:#e58b7a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Inter",system-ui,Segoe UI,sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font:600 24px/1.2 Georgia,"Lora",serif; margin:0 0 4px; }
  h2 { font:600 17px Georgia,serif; margin:0 0 10px; }
  h2.grp { font-size:14px; margin:16px 0 6px; color:var(--muted); }
  .muted { color:var(--muted); font-size:13px; }
  section { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin:16px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  label { display:flex; flex-direction:column; gap:3px; font-size:13px; color:var(--muted); }
  input, select { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:6px 8px; }
  input[type=checkbox] { width:18px; height:18px; }
  button { font:inherit; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:8px; padding:7px 14px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; }
  .dot.on { background:var(--ok); }
  #msg { margin-top:10px; white-space:pre-wrap; }
  .err { color:var(--err); } .okc { color:var(--ok); }
  ul { padding-left:18px; margin:6px 0 0; }
</style>
</head>
<body>
<main>
  <h1>ETABS Creator</h1>
  <p class="muted">Generează modele de test pentru verificator. Pornește o instanță ETABS nouă; instanțele tale deschise nu sunt atinse.</p>

  <section>
    <h2>1. ETABS</h2>
    <div class="row">
      <span class="dot" id="dot"></span><span id="state">se verifică…</span>
      <button class="primary" id="open">Deschide ETABS nou</button>
      <button id="close">Închide</button>
    </div>
  </section>

  <section>
    <h2>2. Model</h2>
    <div id="form"></div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="build" disabled>Creează modelul</button>
      <span class="muted" id="hint">Pornește mai întâi ETABS.</span>
    </div>
    <div id="msg"></div>
  </section>

  <section>
    <h2>Modele create</h2>
    <ul id="models"><li class="muted">Niciunul încă.</li></ul>
  </section>
</main>
<script src="/static/fields.js"></script>
<script src="/static/presets.js"></script>
<script src="/static/form.js"></script>
</body>
</html>
